const ctl=(i,s)=>{const b=(a,l,c="")=>`<button data-a="${a}" data-i="${i}" class="${c}">${l}</button>`;return`<div class="ctl">${b("up","↑")}${b("down","↓")}${b("dup","Duplicate")}${s.k==="cta"||s.k==="hero"?"":b("bg","Background")}${b("pad","Spacing")}${b("hide",s.hide?"Show":"Hide")}${s.l!==undefined?b("link","Link"):""}${s.k==="imgtext"?b("flip","Flip"):""}${s.k==="quote"?b("demo","Demo tag"):""}${s.k==="gallery"?b("flt","Filters"):""}${b("del","Delete","x")}</div>`};

 app.innerHTML=L.map((s,i)=>s.hide&&!editing?"":`<section class="s bg-${s.bg||"w"} pad-${s.pad||"m"} k-${s.k} ${s.hide?"hid":""}" data-i="${i}">${editing?ctl(i,s):""}${body(s,i)}</section>`).join("")+(editing?`<div class="addrow"><button data-a="add">+ Add section</button></div>`:"")+`<footer>© Colourist · Personal colour analysis, Indonesia and Asia</footer>`;

function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",3500)}

 dlg.onclose=()=>{if(dlg.returnValue!=="ok")return r(null);const o={};new FormData(f).forEach((x,k)=>o[k]=x);r(o)};dlg.showModal()})}
async function editMedia(p){const m=get(p);const r=await ask("Replace media",[{n:"f",l:"Upload image or MP4 (max 20 MB)",t:"file",a:"image/*,video/mp4"},{n:"u",l:"Or paste an image or video URL",t:"text"},{n:"a",l:"Alt text",t:"text"},{n:"pos",l:"Position",t:"select",o:[["50% 0%","Top"],["50% 50%","Centre"],["50% 100%","Bottom"]]}],m);if(!r)return;
 let u=r.u.trim(),t=m.t;const f=r.f;
 if(f&&f.size){if(f.size>20*1048576)return toast("File is over 20 MB. Use a URL instead.");if(!AS)return toast("Uploads are not available here. Paste a URL instead.");toast("Uploading…");try{u=(await AS.upload(f)).url;t=f.type.startsWith("video")?"video":"image"}catch(e){return toast("Upload failed. Try a smaller file.")}}
 else if(u)t=/\.(mp4|webm)(\?|$)/i.test(u)?"video":"image";else t="";
 snap();Object.assign(m,{u,t,a:r.a,pos:r.pos});render()}
async function act(a,i,j,el){const L=S.pages[cur],s=L[i];
 if(a==="media")return editMedia(el.dataset.p);
 if(a==="add"){const r=await ask("Add section",[{n:"k",l:"Type",t:"select",o:[["text","Editorial text"],["imgtext","Image with text"],["full","Full-width image or video"],["hero","Hero"],["gallery","Image gallery"],["list","Services list"],["quote","Testimonial"],["faq","FAQ"],["cta","Call to action"]]}],{},"Add");if(!r)return;snap();L.push(NEW[r.k]());return render()}
 if(a==="del"){if(!await ask("Delete this section?",[],{},"Delete"))return;snap();L.splice(i,1);return render()}
 if(a==="delitem"){if(!await ask("Remove this item?",[],{},"Remove"))return;snap();s.it.splice(j,1);return render()}
 snap();
 if(a==="up"&&i>0)[L[i-1],L[i]]=[L[i],L[i-1]];if(a==="down"&&i<L.length-1)[L[i+1],L[i]]=[L[i],L[i+1]];
 if(a==="dup")L.splice(i+1,0,JSON.parse(JSON.stringify(s)));
 if(a==="bg")s.bg={w:"l",l:"k",k:"w"}[s.bg||"w"];
 if(a==="pad")s.pad={s:"m",m:"l",l:"s"}[s.pad||"m"];
 if(a==="hide")s.hide=!s.hide;if(a==="flip")s.f=s.f?0:1;if(a==="demo")s.demo=!s.demo;if(a==="flt")s.flt=!s.flt;
 if(a==="additem")s.it.push(JSON.parse(JSON.stringify(NEW[s.k]().it[0])));
 if(a==="link"){hist.pop();const r=await ask("Button destination",[{n:"l",l:"Link (#book, #services or https://…)",t:"text"}],s);if(!r)return;snap();s.l=r.l}
 render()}

 b.innerHTML=`<button data-b="undo">Undo</button><button data-b="redo">Redo</button><span class="sep"></span><button data-b="B"><b>B</b></button><button data-b="I"><i>I</i></button><button data-b="U"><u>U</u></button><button data-b="L">Left</button><button data-b="C">Centre</button><button data-b="sm">A−</button><button data-b="lg">A+</button><button data-b="up">CAPS</button><select data-b="ff" aria-label="Font"><option value="">Font</option><option value="var(--serif)">Serif</option><option value="var(--sans)">Sans</option></select><span class="sep"></span><button data-b="d" class="${app.className===""?"on":""}">Desktop</button><button data-b="t" class="${app.classList.contains("tab")?"on":""}">Tablet</button><button data-b="m" class="${app.classList.contains("mob")?"on":""}">Mobile</button><span class="sep"></span><button data-b="wa">WhatsApp</button><button data-b="draft">Save draft</button><button data-b="pub">Publish</button><button data-b="done">Done</button>`}

 if(x==="undo"&&hist.length){fut.push(JSON.stringify(S));S=JSON.parse(hist.pop());return render()}

 if("BIU".includes(x)&&x.length===1){if(!cp)return toast("Click a piece of text first");document.execCommand({B:"bold",I:"italic",U:"underline"}[x]);cp.dispatchEvent(new Event("input",{bubbles:true}));return}
 if(x==="L")return fmt(c=>c.ta="left");if(x==="C")return fmt(c=>c.ta="center");
 if(x==="sm")return fmt(c=>c.fs=Math.max(.5,+((c.fs||1)-.1).toFixed(2)));if(x==="lg")return fmt(c=>c.fs=Math.min(2,+((c.fs||1)+.1).toFixed(2)));
 if(x==="up")return fmt(c=>c.tt=!c.tt);

 if(x==="pub"){if(!A)return toast("Publishing is only available from the claude.ai artifact page.");if(!await ask("Publish changes to the live site?",[],{},"Publish"))return;
  const c=document.documentElement.cloneNode(true);c.querySelector("#app").innerHTML="";c.querySelector("#app").className="";c.querySelector("#bar").innerHTML="";c.querySelector("#bar").hidden=true;c.querySelector("#toast").removeAttribute("style");c.querySelector("body").className="";c.querySelector("#state").textContent=JSON.stringify(S).replace(/</g,"\\u003c");c.querySelector("#dlg form").innerHTML="";
  try{await A.publish("<!DOCTYPE html>\n"+c.outerHTML);toast("Published")}catch(err){toast(err&&err.code==="conflict"?"Someone else published first. Reloading.":"Publish failed: "+(err&&err.code||"error"))}}});
