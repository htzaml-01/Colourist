    }

    :focus-visible {

    h1, h2, h3 {

    p {

      font-weight: 300;
      margin: 0 0 1em;

    }

    .sm {

      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin: 0 0 1rem;
      font-weight: 500;

    .logo {

      align-items: center;
    }

    .logo img {

    nav {

      border-color: #aaaaaa;
    }

      color: #000000;
      font-weight: 600;
    }

      background: none;
      border: 0;

      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0.4rem;

      }

        background: #ffffff;
        flex-direction: column;
        justify-content: center;
        gap: 1.8rem;
        padding: 2rem;
        display: none;
      }
      nav.open {
        display: flex;
      }
      nav a {
        font: 400 2.2rem var(--font-title);
        text-transform: none;
        letter-spacing: 0;
      }

    }

    }

      font: 400 0.72rem var(--font-body);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      background: none;
      color: inherit;
      cursor: pointer;
      transition: background 0.25s, color 0.25s, border-color 0.25s;
      text-align: center;
    }

      background: #000000;
      color: #ffffff;
      border-color: #000000;
    }

    .btn.btn-solid {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    .btn.btn-solid:hover {
      background: transparent;
      color: #ffffff;
      border-color: #ffffff;
    }

      color: #000000;
      border-color: #ffffff;
    }

    .s {
      position: relative;
    }

    .bg-l { background: var(--color-light); }
    .bg-k { background: var(--color-black); color: #ffffff; }

    .pad-l .wrap { padding-block: clamp(4.5rem, 12cqw, 9.5rem); }
    .wrap { padding-inline: clamp(1.1rem, 5cqw, 4.5rem); }

    .mw {
      position: relative;
      overflow: hidden;
      background: #111111;
    }

    .mw img, .mw video, .mw .ph {
      width: 100%;
      height: 100%;
      object-fit: cover;

      align-items: flex-end;
      padding: 0.8rem;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #ffffff;
      font-family: var(--font-body);
    }

    /* ==========================================================================
       5. Hero Section
       ========================================================================== */
    .hero {
      position: relative;
      height: 90svh;
      min-height: 560px;
      color: #ffffff;
      display: flex;
      align-items: flex-end;
      background: #000000;
    }

    .hero > .mw {
      position: absolute;
      inset: 0;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent 30%, rgba(0, 0, 0, 0.75) 85%);
      pointer-events: none;
      z-index: 1;
    }

    .hero .in {
      position: relative;
      z-index: 2;
      padding: 0 clamp(1.1rem, 5cqw, 4.5rem) clamp(2.5rem, 7vh, 4.5rem);

    .hero p {

      font-size: clamp(1rem, 1.8cqw, 1.25rem);
      max-width: 48ch;
      font-family: var(--font-body);
      font-weight: 300;

    .hero-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1.8rem;
      align-items: center;
    }

    /* ==========================================================================
       6. Grid, Columns, and List Rows
       ========================================================================== */
    .row {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: clamp(1.8rem, 5cqw, 5rem);
      align-items: center;
    }

    .row .mw {
      aspect-ratio: 4/5;
      border-radius: 2px;
    }

    .row.flip .mw {
      order: 2;
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(2rem, 6cqw, 6rem);
    }

    .li {
      display: flex;
      justify-content: space-between;
      gap: 2rem;
      align-items: baseline;
      padding: 1.4rem 0;
      border-top: 1px solid var(--color-border);
    }

    .li .lt {

    .li .ld {
      font-family: var(--font-body);
      color: var(--color-muted);
      font-size: 0.92rem;
      font-weight: 400;
      text-align: right;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.4rem;
      margin-top: 2.2rem;
    }

    .item {
      margin: 0;
      cursor: zoom-in;
    }

    .item .mw {
      aspect-ratio: 4/5;
      border-radius: 2px;
    }

      font-size: 0.82rem;
      color: var(--color-muted);

      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;

      color: #ffffff;
      border-color: #000000;
    }

    .quote {

       7. Call to Action (CTA) & Forms
       ========================================================================== */

      align-items: center;
      text-align: center;

      z-index: 1;

      margin: 0 auto;
      width: 100%;
      z-index: 2;
    }

      margin-inline: auto;
      font-family: var(--font-body);
    }

      gap: 1.4rem;
      max-width: 540px;
    }

    label {
      font-family: var(--font-body);
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-muted);
      display: grid;
      gap: 0.4rem;
    }

    select, input, textarea {
      font: 300 1rem var(--font-body);
      padding: 0.8rem 0;
      border: 0;
      border-bottom: 1px solid #999999;
      background: none;
      color: inherit;
      border-radius: 0;
      outline: none;
    }

    select:focus, input:focus, textarea:focus {
      border-bottom-color: #000000;
    }

    /* ==========================================================================
       8. FAQ Accordion
       ========================================================================== */
    details {
      border-top: 1px solid var(--color-border);
      padding: 1.3rem 0;
      transition: background 0.2s;
    }

    details[open] {
      padding-bottom: 1.6rem;
    }

    summary {
      cursor: pointer;
      font: 400 1.35rem var(--font-title);
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      line-height: 1.2;
    }

    summary::after {
      content: "+";
      font-family: var(--font-body);
      font-size: 1.3rem;
      font-weight: 300;
      transition: transform 0.2s;
    }

    details[open] summary::after {
      content: "−";
    }

    summary::-webkit-details-marker {
      display: none;
    }

    /* ==========================================================================
       9. Footer
       ========================================================================== */
    footer {
      padding: 3.5rem clamp(1.1rem, 4vw, 3.5rem) 2.5rem;
      font-size: 0.8rem;
      color: var(--color-muted);
      border-top: 1px solid var(--color-border);
      background: #ffffff;
      font-family: var(--font-body);
    }

    .footer-wrap {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 2rem;
    }

    /* ==========================================================================
       10. Lightbox Modal & Responsive Queries
       ========================================================================== */
    #lb {
      border: 0;
      padding: 1.6rem;
      background: #000000;
      color: #ffffff;
      max-width: min(94vw, 900px);
      width: 100%;
    }

    #lb::backdrop {
      background: rgba(0, 0, 0, 0.7);
    }

    #lb .mw {
      aspect-ratio: 16/10;
    }

    #lb p {
      padding: 1rem 0 0;
      margin: 0;
      font-size: 0.9rem;
      color: #cccccc;
    }

    @container (max-width: 820px) {
      .row, .two {
        grid-template-columns: 1fr;
      }
      .row.flip .mw {
        order: 0;
      }
      .grid {
        grid-template-columns: 1fr 1fr;
      }
      .li {
        flex-direction: column;
        gap: 0.4rem;
        align-items: flex-start;
      }
      .li .ld {
        text-align: left;
      }
    }

    @container (max-width: 520px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        scroll-behavior: auto;
      }
    }
  </style>
</head>

    /**

    /**
     * Component Renderers
     */
    function renderMedia(media) {
      if (!media || !media.url) {
        return `<div class="ph">Placeholder</div>`;
      }
      if (media.type === "video") {
        return `<video src="${escapeHtml(media.url)}" muted loop playsinline autoplay style="object-position: ${media.position || '50% 50%'}"></video>`;
      }
      return `<img src="${escapeHtml(media.url)}" alt="${escapeHtml(media.alt || '')}" loading="lazy" style="object-position: ${media.position || '50% 50%'}">`;
    }

    function renderButton(text, link, isSolid = false) {
      if (!text || !link) return "";
      const solidClass = isSolid ? " btn-solid" : "";
      return `<a class="btn${solidClass}" href="${escapeHtml(link)}">${escapeHtml(text)}</a>`;
    }

    function renderSection(section, index) {
      switch (section.type) {
        case "hero": {
          const btn1 = renderButton(section.buttonText, section.buttonLink);
          const btn2 = section.buttonText2 ? renderButton(section.buttonText2, section.buttonLink2) : "";
          return `
            <div class="hero">
              <div class="mw">${renderMedia(section.media)}</div>
              <div class="in">
                <h1>${escapeHtml(section.title)}</h1>
                <p>${escapeHtml(section.description)}</p>
                <div class="hero-btns">${btn1}${btn2}</div>
              </div>
            </div>`;
        }

        case "text":
          return `
            <div class="wrap">
              ${section.label ? `<p class="sm">${escapeHtml(section.label)}</p>` : ""}
              <h2>${escapeHtml(section.title)}</h2>
              <div style="margin-top: 2rem;">
                <p>${section.description}</p>
              </div>
            </div>`;

        case "imgtext": {
          const flipClass = section.flip ? " flip" : "";
          const btnHtml = section.buttonText ? renderButton(section.buttonText, section.buttonLink) : "";
          return `
            <div class="wrap row${flipClass}">
              <div class="mw">${renderMedia(section.media)}</div>
              <div>
                ${section.label ? `<p class="sm">${escapeHtml(section.label)}</p>` : ""}
                <h2>${escapeHtml(section.title)}</h2>
                <div style="margin: 1.5rem 0;">
                  <p>${section.description}</p>
                </div>
                ${btnHtml}
              </div>
            </div>`;
        }

        case "list": {
          const listItemsHtml = (section.items || []).map(item => `
            <div class="li">
              <span class="lt">${escapeHtml(item.title)}</span>
              <span class="ld">${escapeHtml(item.desc)}</span>
            </div>
          `).join("");
          const btnHtml = section.buttonText ? `<p style="margin-top: 2.2rem;">${renderButton(section.buttonText, section.buttonLink)}</p>` : "";
          return `
            <div class="wrap">
              ${section.label ? `<p class="sm">${escapeHtml(section.label)}</p>` : ""}
              <h2>${escapeHtml(section.title)}</h2>
              <div style="margin-top: 2rem;">${listItemsHtml}</div>
              ${btnHtml}
            </div>`;
        }

        case "gallery": {
          const categories = [...new Set((section.items || []).map(x => x.category))];
          const activeFilter = activeFilters[index] || "All";

          const filterButtons = section.hasFilters ? `
            <div class="flt" data-gallery-index="${index}">
              ${["All", ...categories].map(cat => `
                <button aria-pressed="${cat === activeFilter}">${escapeHtml(cat)}</button>
              `).join("")}
            </div>` : "";

          const galleryCards = (section.items || [])
            .filter(item => activeFilter === "All" || item.category === activeFilter)
            .map((item, itemIdx) => `
              <figure class="item" data-item-idx="${itemIdx}">
                <div class="mw">${renderMedia(item.media)}</div>
                <figcaption>
                  <span>${escapeHtml(item.category)}</span> — <span>${escapeHtml(item.caption)}</span>
                </figcaption>
              </figure>
            `).join("");

          return `
            <div class="wrap">
              ${section.label ? `<p class="sm">${escapeHtml(section.label)}</p>` : ""}
              <h2>${escapeHtml(section.title)}</h2>
              ${filterButtons}
              <div class="grid">${galleryCards}</div>
            </div>`;
        }

        case "faq": {
          const faqItemsHtml = (section.items || []).map(faq => `
            <details>
              <summary>${escapeHtml(faq.question)}</summary>
              <p style="margin-top: 1.2rem; color: var(--color-muted); line-height: 1.8;">${faq.answer}</p>
            </details>
          `).join("");
          return `
            <div class="wrap">
              <h2>${escapeHtml(section.title)}</h2>
              <div style="margin-top: 2rem;">${faqItemsHtml}</div>
            </div>`;
        }

        case "cta": {
          const btnHtml = section.buttonText ? renderButton(section.buttonText, section.buttonLink) : "";
          return `
            <div class="mw">${renderMedia(section.media)}</div>
            <div class="wrap ct" style="color: #ffffff; text-shadow: 0 2px 14px rgba(0, 0, 0, 0.65);">
              <h2>${escapeHtml(section.title)}</h2>
              <div style="margin-top: 2.2rem;">${btnHtml}</div>
            </div>`;
        }

        case "book": {
          const serviceOptions = [
            "Personal Color Analysis (IDR 1,900,000)",
            "Personal Styling (IDR 2,500,000)",
            "Makeup Masterclass (IDR 1,500,000)",
            "Custom Lipstick (IDR 500,000)",
            "Malaysia Pop-up Session"

          return `
            <div class="wrap two">
              <form class="bf" id="bookingForm">
                <label>
                  Service
                  <select id="bookService">${optionsHtml}</select>
                </label>
                <label>
                  Your Name
                  <input id="bookName" required autocomplete="name" placeholder="Full name">
                </label>
                <label>
                  Preferred Date
                  <input id="bookDate" type="date">
                </label>
                <label>
                  Notes / Inquiries
                  <textarea id="bookNotes" rows="3" placeholder="Number of guests, preferred time, questions..."></textarea>
                </label>
                <button class="btn btn-solid" style="background: #000000; color: #ffffff;" type="submit">
                  Continue to WhatsApp Booking
                </button>
              </form>
              <div>
                <p>${section.info || ''}</p>
              </div>
            </div>`;
        }

        case "atelier":
          return `
            <div class="wrap two" style="align-items: start;">
              <div>
                <p class="sm">Visit Us</p>
                <h2 style="font-style: italic; margin-bottom: 1.5rem;">Our Atelier.</h2>
                <div style="line-height: 1.75;">
                  <p class="sm" style="margin-bottom: 0.3rem;">Address</p>
                  <p><b>ASHTA District 8</b><br>Jl. Jend. Sudirman Kav. 52–53, SCBD<br>South Jakarta 12190</p>
                  <p class="sm" style="margin: 1.4rem 0 0.3rem;">Hours — By Appointment Only</p>
                  <div style="display: grid; grid-template-columns: auto 1fr; gap: 0.4rem 1.5rem; max-width: 320px; margin-bottom: 1rem;">
                    <span>Weekdays</span><span style="text-align: right;">10.00 – 20.00</span>
                    <span>Weekends</span><span style="text-align: right;">10.00 – 18.00</span>
                    <span>Home Service</span><span style="text-align: right;">By request</span>
                  </div>
                  <p class="sm" style="margin: 1.4rem 0 0.3rem;">Book &amp; Follow</p>
                  <p>
                    <a href="${SITE_DATA.instagramUrl}" target="_blank" rel="noopener" style="text-decoration: underline;">@colourist_id on Instagram</a><br>
                    <a href="${SITE_DATA.bookingUrl}" target="_blank" rel="noopener" style="text-decoration: underline;">WhatsApp: bit.ly/BookMySessionToday</a><br>
                    <a href="https://maps.google.com/?q=ASHTA+District+8+SCBD" target="_blank" rel="noopener" style="text-decoration: underline;">Google Reviews &amp; Directions</a>
                  </p>
                  <p style="font-size: 0.82rem; color: var(--color-muted); margin-top: 1.5rem;">
                    Sessions are by appointment only. Credit card installment available.
                  </p>
                </div>
              </div>
              <div>
                <div class="mw" style="aspect-ratio: 4/3; border: 1px solid var(--color-border); overflow: hidden;">
                  <iframe src="https://maps.google.com/maps?q=ASHTA%20District%208%20Jakarta&t=&z=15&ie=UTF8&iwloc=&output=embed" width="100%" height="100%" style="border: 0;" allowfullscreen="" loading="lazy"></iframe>
                </div>
              </div>
            </div>`;

        default:
          return "";
      }
    }

    /**
     * Main Page Renderer
     */
    function renderPage() {
      const savedScrollY = scrollY;
      const currentSections = SITE_DATA.pages[currentPage] || SITE_DATA.pages.home;

      const sectionsHtml = currentSections.map((section, index) => {
        const bgClass = `bg-${section.bg || 'w'}`;
        const padClass = `pad-${section.pad || 'm'}`;
        const typeClass = `k-${section.type}`;
        return `
          <section class="s ${bgClass} ${padClass} ${typeClass}" data-section-index="${index}">
            ${renderSection(section, index)}
          </section>`;
      }).join("");

      const footerHtml = `
        <footer>
          <div class="footer-wrap">
            <div>
              <a href="#home">
                <img src="Asset/logo.png" alt="Colourist by Zerlinda" style="height: 32px; width: auto; margin-bottom: 0.8rem;">
              </a>
              <p style="margin: 0; font-size: 0.8rem; color: var(--color-muted); line-height: 1.6;">
                Colourist by Zerlinda · Asia’s Leading &amp; No. 1 Color Expert<br>
                ASHTA District 8, Jl. Jend. Sudirman Kav. 52–53, SCBD, South Jakarta 12190
              </p>
            </div>
            <div style="display: flex; gap: 1.6rem; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; align-items: center; flex-wrap: wrap;">
              <a href="${SITE_DATA.instagramUrl}" target="_blank" rel="noopener">Instagram</a>
              <a href="${SITE_DATA.bookingUrl}" target="_blank" rel="noopener">WhatsApp</a>
              <a href="#book">Book an Experience</a>
            </div>
          </div>
        </footer>`;

      appElement.innerHTML = sectionsHtml + footerHtml;

      // Autoplay any video elements in the view
      appElement.querySelectorAll("video").forEach(video => {
        video.muted = true;
        video.play().catch(() => {});
      });

      scrollTo(0, savedScrollY);
    }

    /**
     * Routing & Page Navigation Handler
     */
    function handleRoute() {
      let hash = (location.hash || "#home").slice(1).toLowerCase();

      // Legacy aliases
      if (hash === "philosophy") hash = "story";
      if (hash === "services") hash = "experiences";
      if (hash === "journal") hash = "transformations";

      currentPage = availablePages.includes(hash) ? hash : "home";

      // Update navigation active states
      document.querySelectorAll("nav a").forEach(link => {
        const targetHash = link.getAttribute("href").slice(1).toLowerCase();
        if (targetHash === currentPage) {
          link.setAttribute("aria-current", "page");
        } else {
          link.removeAttribute("aria-current");
        }
      });

      // Close mobile navigation drawer if open
      $("#nav").classList.remove("open");
      $(".menu").setAttribute("aria-expanded", "false");

      // Update page titles
      const pageTitles = {
        home: "Colourist — Asia’s Leading & No. 1 Color Expert",
        story: "Our Story — Colourist",
        experiences: "Experiences — Colourist",
        transformations: "Transformations — Colourist",
        malaysia: "Colourist Malaysia",
        book: "Book an Experience — Colourist"
      };
      document.title = pageTitles[currentPage] || "Colourist";

      renderPage();
      scrollTo(0, 0);
    }

    /* ==========================================================================
       Event Listeners
       ========================================================================== */

    // Navigation and hash change
    addEventListener("hashchange", handleRoute);

    // Mobile menu toggle
    $(".menu").addEventListener("click", () => {
      const isOpen = $("#nav").classList.toggle("open");
      $(".menu").setAttribute("aria-expanded", isOpen);
    });

    // Delegated clicks for Gallery filters and Lightbox zoom
    appElement.addEventListener("click", event => {
      // 1. Gallery filter clicks
      const filterBtn = event.target.closest(".flt button");
      if (filterBtn) {
        const galleryIndex = +filterBtn.parentNode.dataset.galleryIndex;
        activeFilters[galleryIndex] = filterBtn.textContent.trim();
        return renderPage();
      }

      // 2. Lightbox item click
      const galleryItem = event.target.closest(".item");
      if (galleryItem) {
        const sectionEl = galleryItem.closest("[data-section-index]");
        const sectionIdx = +sectionEl.dataset.sectionIndex;
        const itemIdx = +galleryItem.dataset.itemIdx;
        const itemData = SITE_DATA.pages[currentPage][sectionIdx].items[itemIdx];

        const lightboxModal = $("#lb");
        $("#lbm").innerHTML = galleryItem.querySelector(".mw").innerHTML;
        $("#lbc").textContent = `${stripHtml(itemData.category)} — ${stripHtml(itemData.caption)}`;

        $("#lbm").querySelectorAll("video").forEach(v => {
          v.controls = true;
          v.play().catch(() => {});
        });

        lightboxModal.showModal();
      }
    });

    // Booking form submission via WhatsApp
    appElement.addEventListener("submit", event => {
      event.preventDefault();
      const service = $("#bookService") ? $("#bookService").value : "-";
      const name = $("#bookName") ? $("#bookName").value : "-";
      const date = ($("#bookDate") && $("#bookDate").value) ? $("#bookDate").value : "Flexible";
      const notes = ($("#bookNotes") && $("#bookNotes").value) ? $("#bookNotes").value : "-";

      const message = `Hello Colourist! I would like to book an experience:\n• Service: ${service}\n• Name: ${name}\n• Preferred Date: ${date}\n• Notes: ${notes}`;
      window.open(`https://api.whatsapp.com/send?phone=${SITE_DATA.whatsappNumber}&text=${encodeURIComponent(message)}`, "_blank", "noopener");
    });

    // Initialize application
    handleRoute();
  </script>
